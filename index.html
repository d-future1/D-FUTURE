<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>D-FUTURE | المنصة المركزية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #020617; color: #f1f5f9; font-family: sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="min-h-screen">
    <div id="app" class="max-w-md mx-auto p-4 mt-10">
        <!-- Login -->
        <div id="loginSection" class="glass p-6 rounded-2xl">
            <h2 class="text-center font-bold mb-6 text-xl">D-FUTURE</h2>
            <input type="password" id="loginInput" placeholder="أدخل الرمز" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-center mb-4 text-cyan-400">
            <button onclick="auth()" class="w-full bg-cyan-600 py-3 rounded-xl font-bold">دخول</button>
        </div>

        <!-- Dashboard (Dynamic) -->
        <div id="mainDashboard" class="hidden space-y-4">
            <div class="flex justify-between items-center mb-6">
                <h2 id="welcomeText" class="font-bold"></h2>
                <button onclick="logout()" class="text-xs text-rose-400">خروج</button>
            </div>
            
            <div id="adminPanel" class="hidden glass p-4 rounded-xl mb-4 border-cyan-500/30">
                <h3 class="text-xs text-cyan-400 mb-2 font-bold uppercase tracking-widest">لوحة التحكم الإدارية</h3>
                <div class="space-y-2">
                    <input id="newStd" placeholder="اسم الطالب" class="w-full bg-slate-900 p-2 rounded text-xs">
                    <button onclick="addStudent()" class="w-full bg-emerald-600 py-2 rounded text-xs">إضافة طالب وتوليد كود</button>
                </div>
            </div>

            <div id="contentList" class="space-y-3"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://buzhgwihzndbczmztfsp.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1emhnd2loem5kYmN6bXp0ZnNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyOTkwNjksImV4cCI6MjEwMTg3NTA2OX0.1tdXOa9wamfW3hBwdaTTpNK9U1g5G4Mqf2hwAe1Ojec';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function auth() {
            const input = document.getElementById('loginInput').value.trim().toUpperCase();
            if (input === 'ADMIN-DFUTURE-2026') {
                showDashboard(true);
            } else {
                const { data } = await db.from('subscription_codes').select('*').eq('code', input).maybeSingle();
                if (data) {
                    localStorage.setItem('user', JSON.stringify(data));
                    showDashboard(false);
                } else { alert('رمز خاطئ'); }
            }
        }

        async function showDashboard(isAdmin) {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('mainDashboard').classList.remove('hidden');
            
            if (isAdmin) {
                document.getElementById('adminPanel').classList.remove('hidden');
                document.getElementById('welcomeText').innerText = "مرحباً د. أمير (المدير)";
                loadAdminData();
            } else {
                document.getElementById('welcomeText').innerText = "مرحباً بك في المنهج";
                loadSubjects();
            }
        }

        async function loadSubjects() {
            const { data } = await db.from('subjects').select('*');
            document.getElementById('contentList').innerHTML = data.map(s => `
                <div class="glass p-4 rounded-xl flex justify-between items-center">
                    <div><h4 class="font-bold text-sm">${s.title}</h4><p class="text-[10px] text-slate-500">${s.description}</p></div>
                    <i class="fa fa-chevron-left text-xs text-slate-600"></i>
                </div>
            `).join('');
        }

        async function loadAdminData() {
            const { data } = await db.from('subscription_codes').select('*');
            document.getElementById('contentList').innerHTML = data.map(c => `
                <div class="glass p-3 rounded-lg flex justify-between text-xs">
                    <span>${c.student_name}</span><span class="text-cyan-400 font-mono">${c.code}</span>
                </div>
            `).join('');
        }

        async function addStudent() {
            const name = document.getElementById('newStd').value;
            const code = 'DF-' + Math.random().toString(36).substr(2, 6).toUpperCase();
            await db.from('subscription_codes').insert({ code, student_name: name });
            alert('تم: ' + code);
            loadAdminData();
        }

        function logout() { localStorage.clear(); location.reload(); }
    </script>
</body>
</html>
