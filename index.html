<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>D-FUTURE | المنصة المركزية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #020617; color: #f1f5f9; font-family: sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="min-h-screen p-4 pb-12">
    <div id="app" class="max-w-md mx-auto mt-6">
        
        <!-- شاشة تسجيل الدخول -->
        <div id="loginSection" class="glass p-6 rounded-2xl shadow-2xl">
            <div class="text-center mb-6">
                <div class="text-3xl mb-2">🦷</div>
                <h2 class="font-bold text-lg text-white">D-FUTURE</h2>
                <p class="text-xs text-slate-400">أدخل رمز التفعيل أو رمز المدير</p>
            </div>
            <input type="password" id="loginInput" placeholder="أدخل الرمز هنا" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-center mb-4 text-cyan-400 tracking-widest outline-none focus:border-cyan-500">
            <button onclick="auth()" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 py-3 rounded-xl font-bold text-sm shadow-lg">دخول المنصة</button>
            <p id="loginMsg" class="text-center text-xs text-rose-400 mt-3 hidden"></p>
        </div>

        <!-- اللوحة الرئيسية -->
        <div id="mainDashboard" class="hidden space-y-4">
            <div class="glass p-4 rounded-xl flex justify-between items-center">
                <div>
                    <h2 id="welcomeText" class="font-bold text-sm text-white"></h2>
                    <p class="text-[10px] text-cyan-400">المرحلة الخامسة - طب الأسنان</p>
                </div>
                <button onclick="logout()" class="text-xs bg-rose-500/10 text-rose-400 border border-rose-500/30 px-3 py-1.5 rounded-lg">خروج</button>
            </div>
            
            <!-- أزرار تحكم المدير (تظهر للمدير فقط) -->
            <div id="adminControls" class="hidden space-y-3">
                <div class="flex gap-2 bg-slate-900 p-1.5 rounded-xl border border-slate-800 text-xs">
                    <button onclick="switchAdminTab('students')" id="tabStudents" class="flex-1 py-2 rounded-lg font-bold bg-cyan-600 text-white transition">الطلاب والأكواد</button>
                    <button onclick="switchAdminTab('subjects')" id="tabSubjects" class="flex-1 py-2 rounded-lg font-bold text-slate-400 transition">إدارة المواد</button>
                    <button onclick="switchAdminTab('materials')" id="tabMaterials" class="flex-1 py-2 rounded-lg font-bold text-slate-400 transition">إضافة ملازم</button>
                </div>

                <!-- قسم إدارة الطلاب -->
                <div id="sectionStudents" class="glass p-4 rounded-xl space-y-3">
                    <h3 class="text-xs text-cyan-400 font-bold"><i class="fa-solid fa-users mr-1"></i> توليد كود طالب جديد</h3>
                    <input id="newStdName" placeholder="اسم الطالب الثلاثي" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-xs text-white outline-none">
                    <button onclick="addStudent()" class="w-full bg-emerald-600 hover:bg-emerald-700 py-2 rounded-lg text-xs font-medium">إنشاء وتوليد الكود</button>
                </div>

                <!-- قسم إدارة المواد -->
                <div id="sectionSubjects" class="glass p-4 rounded-xl space-y-3 hidden">
                    <h3 class="text-xs text-cyan-400 font-bold"><i class="fa-solid fa-book mr-1"></i> إضافة مادة دراسية جديدة</h3>
                    <input id="newSubTitle" placeholder="اسم المادة (مثال: تقويم الأسنان)" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-xs text-white outline-none">
                    <input id="newSubDesc" placeholder="الوصف أو المرحلة" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-xs text-white outline-none">
                    <button onclick="addSubject()" class="w-full bg-blue-600 hover:bg-blue-700 py-2 rounded-lg text-xs font-medium">إضافة المادة للمنهج</button>
                </div>

                <!-- قسم إضافة الملازم والملخصات -->
                <div id="sectionMaterials" class="glass p-4 rounded-xl space-y-3 hidden">
                    <h3 class="text-xs text-cyan-400 font-bold"><i class="fa-solid fa-file-pdf mr-1"></i> رفع ملزمة أو ملخص لمادة</h3>
                    <select id="matSubjectSelect" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-xs text-white outline-none">
                        <!-- تعبئة تلقائية للمواد -->
                    </select>
                    <input id="matTitle" placeholder="عنوان الملزمة (مثال: المحاضرة الأولى - الجراحة)" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-xs text-white outline-none">
                    <input id="matUrl" placeholder="رابط الملف (رابط PDF أو رابط تليجرام)" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-xs text-white outline-none">
                    <select id="matType" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-xs text-white outline-none">
                        <option value="محاضرة">محاضرة رسمية</option>
                        <option value="ملخص">ملخص طالب</option>
                        <option value="أسئلة">بنك أسئلة / كويزات</option>
                    </select>
                    <button onclick="addMaterial()" class="w-full bg-purple-600 hover:bg-purple-700 py-2 rounded-lg text-xs font-medium">إضافة الملزمة للمادة</button>
                </div>
            </div>

            <!-- محتوى الصفحة (المواد أو تفاصيل المادة أو قائمة الأكواد) -->
            <div id="contentList" class="space-y-3">
                <div class="glass p-4 rounded-xl text-center text-xs text-slate-400">جاري التحميل...</div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://buzhgwihzndbczmztfsp.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1emhnd2loem5kYmN6bXp0ZnNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyOTkwNjksImV4cCI6MjEwMTg3NTA2OX0.1tdXOa9wamfW3hBwdaTTpNK9U1g5G4Mqf2hwAe1Ojec';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isAdminUser = false;

        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('df_session');
            if (saved) {
                if (saved === 'ADMIN') {
                    isAdminUser = true;
                    showDashboard(true);
                } else {
                    verifyStudentSession(saved);
                }
            }
        });

        async function auth() {
            const input = document.getElementById('loginInput').value.trim().toUpperCase();
            const msg = document.getElementById('loginMsg');
            msg.classList.add('hidden');

            if (!input) return;

            if (input === 'ADMIN-DFUTURE-2026') {
                localStorage.setItem('df_session', 'ADMIN');
                isAdminUser = true;
                showDashboard(true);
                return;
            }

            const { data } = await db.from('subscription_codes').select('*').eq('code', input).maybeSingle();
            if (data) {
                localStorage.setItem('df_session', input);
                isAdminUser = false;
                showDashboard(false, data.student_name);
            } else {
                msg.innerText = 'رمز التفعيل غير صحيح.';
                msg.classList.remove('hidden');
            }
        }

        async function verifyStudentSession(code) {
            const { data } = await db.from('subscription_codes').select('*').eq('code', code).maybeSingle();
            if (data) {
                isAdminUser = false;
                showDashboard(false, data.student_name);
            } else {
                logout();
            }
        }

        function showDashboard(isAdmin, studentName = '') {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('mainDashboard').classList.remove('hidden');
            
            if (isAdmin) {
                document.getElementById('adminControls').classList.remove('hidden');
                document.getElementById('welcomeText').innerText = "مرحباً د. أمير (المدير العام)";
                loadAdminStudents();
                loadSubjectDropdown();
            } else {
                document.getElementById('welcomeText').innerText = "مرحباً بك، " + (studentName || 'طالب');
                loadSubjectsForStudent();
            }
        }

        function switchAdminTab(tab) {
            document.getElementById('sectionStudents').classList.add('hidden');
            document.getElementById('sectionSubjects').classList.add('hidden');
            document.getElementById('sectionMaterials').classList.add('hidden');
            
            document.getElementById('tabStudents').className = "flex-1 py-2 rounded-lg font-bold text-slate-400 transition";
            document.getElementById('tabSubjects').className = "flex-1 py-2 rounded-lg font-bold text-slate-400 transition";
            document.getElementById('tabMaterials').className = "flex-1 py-2 rounded-lg font-bold text-slate-400 transition";

            if (tab === 'students') {
                document.getElementById('sectionStudents').classList.remove('hidden');
                document.getElementById('tabStudents').className = "flex-1 py-2 rounded-lg font-bold bg-cyan-600 text-white transition";
                loadAdminStudents();
            } else if (tab === 'subjects') {
                document.getElementById('sectionSubjects').classList.remove('hidden');
                document.getElementById('tabSubjects').className = "flex-1 py-2 rounded-lg font-bold bg-blue-600 text-white transition";
                loadAdminSubjects();
            } else if (tab === 'materials') {
                document.getElementById('sectionMaterials').classList.remove('hidden');
                document.getElementById('tabMaterials').className = "flex-1 py-2 rounded-lg font-bold bg-purple-600 text-white transition";
                loadAdminMaterialsList();
            }
        }

        // --- وظائف عرض المواد للطلاب ---
        async function loadSubjectsForStudent() {
            const container = document.getElementById('contentList');
            const { data } = await db.from('subjects').select('*');

            if (!data || data.length === 0) {
                container.innerHTML = `<div class="glass p-4 rounded-xl text-center text-xs text-slate-400">لا توجد مواد مضافة حالياً.</div>`;
                return;
            }

            container.innerHTML = `<h3 class="text-xs font-bold text-slate-300 mb-2">المواد الدراسية الأساسية</h3>` + data.map(s => `
                <div onclick="openSubjectDetails(${s.id}, '${s.title}')" class="glass p-4 rounded-xl flex justify-between items-center hover:border-cyan-500/50 transition cursor-pointer">
                    <div>
                        <h4 class="font-bold text-xs text-white">${s.title}</h4>
                        <p class="text-[10px] text-slate-400 mt-0.5">${s.description || 'المرحلة الخامسة'}</p>
                    </div>
                    <i class="fa-solid fa-chevron-left text-xs text-slate-500"></i>
                </div>
            `).join('');
        }

        // فتح مادة لعرض ملازمها
        async function openSubjectDetails(subjectId, subjectTitle) {
            const container = document.getElementById('contentList');
            container.innerHTML = `<div class="text-center text-xs text-slate-400 p-4">جاري تحميل الملازم...</div>`;

            const { data } = await db.from('materials').select('*').eq('subject_id', subjectId);

            let html = `
                <div class="flex items-center justify-between mb-2">
                    <button onclick="loadSubjectsForStudent()" class="text-xs bg-slate-800 text-cyan-400 px-3 py-1 rounded-lg"><i class="fa-solid fa-arrow-right mr-1"></i> رجوع للمواد</button>
                    <h3 class="text-xs font-bold text-white">${subjectTitle}</h3>
                </div>
            `;

            if (!data || data.length === 0) {
                html += `<div class="glass p-6 rounded-xl text-center text-xs text-slate-400">لا توجد ملازم أو ملخصات مرفوعة لهذه المادة حتى الآن.</div>`;
            } else {
                html += data.map(m => `
                    <div class="glass p-3 rounded-xl flex justify-between items-center text-xs">
                        <div>
                            <span class="bg-cyan-500/10 text-cyan-400 px-2 py-0.5 rounded text-[10px] ml-2 font-bold">${m.material_type}</span>
                            <span class="font-bold text-white">${m.title}</span>
                        </div>
                        <a href="${m.file_url}" target="_blank" class="bg-cyan-600 hover:bg-cyan-700 text-white px-3 py-1.5 rounded-lg text-[11px]"><i class="fa-solid fa-download mr-1"></i> فتح الرابط</a>
                    </div>
                `).join('');
            }
            container.innerHTML = html;
        }

        // --- إدارة المدير ---
        async function loadAdminStudents() {
            const container = document.getElementById('contentList');
            const { data } = await db.from('subscription_codes').select('*').order('created_at', { ascending: false });
            container.innerHTML = `<h3 class="text-xs font-bold text-slate-300 mb-2">قائمة الطلاب والأكواد (${data?.length || 0})</h3>` + (data || []).map(c => `
                <div class="glass p-3 rounded-xl flex justify-between items-center text-xs">
                    <div>
                        <span class="font-bold text-white block">${c.student_name}</span>
                        <span class="text-[10px] text-cyan-400 font-mono">${c.code}</span>
                    </div>
                    ${c.code !== 'ADMIN-DFUTURE-2026' ? `<button onclick="deleteCode('${c.code}')" class="text-rose-400 p-2"><i class="fa-solid fa-trash"></i></button>` : ''}
                </div>
            `).join('');
        }

        async function loadAdminSubjects() {
            const container = document.getElementById('contentList');
            const { data } = await db.from('subjects').select('*');
            container.innerHTML = `<h3 class="text-xs font-bold text-slate-300 mb-2">إدارة المواد الدراسية</h3>` + (data || []).map(s => `
                <div class="glass p-3 rounded-xl flex justify-between items-center text-xs">
                    <div>
                        <span class="font-bold text-white block">${s.title}</span>
                        <span class="text-[10px] text-slate-400">${s.description || ''}</span>
                    </div>
                    <button onclick="deleteSubject(${s.id})" class="text-rose-400 p-2"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');
        }

        async function loadAdminMaterialsList() {
            const container = document.getElementById('contentList');
            const { data } = await db.from('materials').select('*, subjects(title)');
            container.innerHTML = `<h3 class="text-xs font-bold text-slate-300 mb-2">جميع الملازم المرفوعة</h3>` + (data || []).map(m => `
                <div class="glass p-3 rounded-xl flex justify-between items-center text-xs">
                    <div>
                        <span class="text-[10px] text-cyan-400 block">${m.subjects?.title || 'مادة محذوفة'}</span>
                        <span class="font-bold text-white">${m.title}</span>
                    </div>
                    <button onclick="deleteMaterial(${m.id})" class="text-rose-400 p-2"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');
        }

        async function loadSubjectDropdown() {
            const select = document.getElementById('matSubjectSelect');
            const { data } = await db.from('subjects').select('*');
            if (data) {
                select.innerHTML = data.map(s => `<option value="${s.id}">${s.title}</option>`).join('');
            }
        }

        async function addStudent() {
            const name = document.getElementById('newStdName').value.trim();
            if (!name) return alert('الرجاء إدخال اسم الطالب');
            const code = 'DF-' + Math.random().toString(36).substring(2, 8).toUpperCase();
            const { error } = await db.from('subscription_codes').insert({ code, student_name: name });
            if (!error) {
                alert('تم إنشاء الكود بنجاح: ' + code);
                document.getElementById('newStdName').value = '';
                loadAdminStudents();
            }
        }

        async function addSubject() {
            const title = document.getElementById('newSubTitle').value.trim();
            const desc = document.getElementById('newSubDesc').value.trim();
            if (!title) return alert('أدخل اسم المادة');
            const { error } = await db.from('subjects').insert({ title, description: desc });
            if (!error) {
                alert('تمت إضافة المادة بنجاح!');
                document.getElementById('newSubTitle').value = '';
                document.getElementById('newSubDesc').value = '';
                loadAdminSubjects();
                loadSubjectDropdown();
            }
        }

        async function addMaterial() {
            const subject_id = document.getElementById('matSubjectSelect').value;
            const title = document.getElementById('matTitle').value.trim();
            const file_url = document.getElementById('matUrl').value.trim();
            const material_type = document.getElementById('matType').value;

            if (!title || !file_url) return alert('الرجاء إدخال العنوان والرابط');
            
            const { error } = await db.from('materials').insert({ subject_id, title, file_url, material_type });
            if (!error) {
                alert('تمت إضافة الملزمة بنجاح للمادة!');
                document.getElementById('matTitle').value = '';
                document.getElementById('matUrl').value = '';
                loadAdminMaterialsList();
            }
        }

        async function deleteCode(code) {
            if (confirm('حذف هذا الكود؟')) {
                await db.from('subscription_codes').delete().eq('code', code);
                loadAdminStudents();
            }
        }

        async function deleteSubject(id) {
            if (confirm('حذف هذه المادة وكل ملازمها؟')) {
                await db.from('subjects').delete().eq('id', id);
                loadAdminSubjects();
                loadSubjectDropdown();
            }
        }

        async function deleteMaterial(id) {
            if (confirm('حذف هذه الملزمة؟')) {
                await db.from('materials').delete().eq('id', id);
                loadAdminMaterialsList();
            }
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }
    </script>
</body>
</html>
