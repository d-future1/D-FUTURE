<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D-FUTURE | المنصة المركزية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #020617; color: #f1f5f9; font-family: sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="min-h-screen p-4">

    <!-- شاشة الدخول -->
    <div id="loginSection" class="max-w-md mx-auto mt-10 glass p-6 rounded-2xl shadow-2xl">
        <h2 class="text-center font-bold text-xl mb-6 text-white">تسجيل الدخول</h2>
        <input type="password" id="passInput" placeholder="أدخل الرمز" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-center mb-4 text-cyan-400 outline-none">
        <button onclick="login()" class="w-full bg-cyan-600 py-3 rounded-xl font-bold text-white">دخول</button>
    </div>

    <!-- اللوحة الرئيسية -->
    <div id="app" class="hidden max-w-md mx-auto mt-6 space-y-4">
        <div class="glass p-4 rounded-xl flex justify-between items-center">
            <h2 id="welcomeTitle" class="font-bold text-sm">مرحباً</h2>
            <button onclick="location.reload()" class="text-xs bg-rose-500/10 text-rose-500 px-3 py-1 rounded">خروج</button>
        </div>

        <!-- لوحة تحكم المدير (تظهر للمدير فقط) -->
        <div id="adminPanel" class="hidden space-y-3">
            <div class="grid grid-cols-3 gap-2">
                <button onclick="showTab('students')" class="bg-slate-800 p-2 rounded text-[10px]">الطلاب</button>
                <button onclick="showTab('subjects')" class="bg-slate-800 p-2 rounded text-[10px]">المواد</button>
                <button onclick="showTab('materials')" class="bg-slate-800 p-2 rounded text-[10px]">الملازم</button>
            </div>
            <div id="adminForms" class="glass p-4 rounded-xl space-y-3">
                <!-- يتم حقن النماذج هنا بواسطة JS -->
            </div>
        </div>

        <div id="contentList" class="space-y-3"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://buzhgwihzndbczmztfsp.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1emhnd2loem5kYmN6bXp0ZnNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyOTkwNjksImV4cCI6MjEwMTg3NTA2OX0.1tdXOa9wamfW3hBwdaTTpNK9U1g5G4Mqf2hwAe1Ojec';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let isAdmin = false;

        async function login() {
            const val = document.getElementById('passInput').value.trim().toUpperCase();
            if(val === 'ADMIN-DFUTURE-2026') {
                isAdmin = true;
                showDashboard("المدير العام");
                renderAdminUI();
            } else {
                const { data } = await supabase.from('subscription_codes').select('*').eq('code', val).maybeSingle();
                if(data) {
                    isAdmin = false;
                    showDashboard(data.student_name);
                    renderStudentUI();
                } else {
                    alert('رمز خاطئ');
                }
            }
        }

        function showDashboard(name) {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('welcomeTitle').innerText = "مرحباً " + name;
        }

        // === إدارة المدير ===
        function renderAdminUI() {
            document.getElementById('adminPanel').classList.remove('hidden');
            showTab('students');
        }

        async function showTab(tab) {
            const forms = document.getElementById('adminForms');
            const list = document.getElementById('contentList');
            list.innerHTML = "";

            if(tab === 'students') {
                forms.innerHTML = `
                    <input id="stdName" placeholder="اسم الطالب" class="w-full bg-slate-900 p-2 rounded text-xs text-white">
                    <button onclick="addStudent()" class="w-full bg-emerald-600 py-2 rounded text-xs">إضافة طالب</button>`;
                const { data } = await supabase.from('subscription_codes').select('*');
                list.innerHTML = data.map(s => `<div class="glass p-3 rounded flex justify-between"><span>${s.student_name}</span><span class="text-cyan-400 font-mono">${s.code}</span></div>`).join('');
            } else if(tab === 'subjects') {
                forms.innerHTML = `
                    <input id="subTitle" placeholder="اسم المادة" class="w-full bg-slate-900 p-2 rounded text-xs text-white">
                    <button onclick="addSubject()" class="w-full bg-blue-600 py-2 rounded text-xs">إضافة مادة</button>`;
                const { data } = await supabase.from('subjects').select('*');
                list.innerHTML = data.map(s => `<div class="glass p-3 rounded flex justify-between"><span>${s.title}</span></div>`).join('');
            } else if(tab === 'materials') {
                forms.innerHTML = `
                    <input id="matTitle" placeholder="عنوان الملزمة" class="w-full bg-slate-900 p-2 rounded text-xs text-white">
                    <input id="matUrl" placeholder="الرابط" class="w-full bg-slate-900 p-2 rounded text-xs text-white">
                    <button onclick="addMat()" class="w-full bg-purple-600 py-2 rounded text-xs">إضافة ملزمة</button>`;
                const { data } = await supabase.from('materials').select('*');
                list.innerHTML = data.map(m => `<div class="glass p-3 rounded"><span>${m.title}</span></div>`).join('');
            }
        }

        async function addStudent() {
            const name = document.getElementById('stdName').value;
            const code = 'DF-' + Math.random().toString(36).substring(2,8).toUpperCase();
            await supabase.from('subscription_codes').insert({student_name: name, code: code});
            alert('تم: ' + code); showTab('students');
        }

        async function addSubject() {
            const title = document.getElementById('subTitle').value;
            await supabase.from('subjects').insert({title: title});
            showTab('subjects');
        }
        
        async function addMat() {
            const title = document.getElementById('matTitle').value;
            const url = document.getElementById('matUrl').value;
            await supabase.from('materials').insert({title: title, file_url: url, subject_id: 1}); // تبسيط
            showTab('materials');
        }

        // === عرض الطالب ===
        async function renderStudentUI() {
            const { data } = await supabase.from('subjects').select('*');
            document.getElementById('contentList').innerHTML = data.map(s => `
                <div class="glass p-4 rounded-xl cursor-pointer hover:bg-slate-800">${s.title}</div>
            `).join('');
        }
    </script>
</body>
</html>
