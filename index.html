<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D-FUTURE | المنصة المركزية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #020617; color: #f1f5f9; font-family: sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="min-h-screen p-4">

    <!-- شاشة الدخول -->
    <div id="loginSection" class="max-w-md mx-auto mt-16 glass p-6 rounded-2xl shadow-2xl">
        <div class="text-center mb-6">
            <div class="text-3xl mb-2">🦷</div>
            <h2 class="font-bold text-lg text-white">تسجيل الدخول للمنصة</h2>
        </div>
        <input type="password" id="passInput" placeholder="أدخل الرمز" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-center mb-4 text-cyan-400 outline-none tracking-widest">
        <button onclick="login()" class="w-full bg-cyan-600 hover:bg-cyan-700 py-3 rounded-xl font-bold text-white transition">دخول</button>
    </div>

    <!-- اللوحة الرئيسية -->
    <div id="app" class="hidden max-w-md mx-auto mt-6 space-y-4">
        <div class="glass p-4 rounded-xl flex justify-between items-center">
            <h2 id="welcomeTitle" class="font-bold text-sm text-white">مرحباً</h2>
            <button onclick="location.reload()" class="text-xs bg-rose-500/10 text-rose-400 border border-rose-500/30 px-3 py-1.5 rounded-lg">خروج</button>
        </div>

        <!-- لوحة تحكم المدير -->
        <div id="adminPanel" class="hidden space-y-3">
            <div class="grid grid-cols-3 gap-2">
                <button onclick="showTab('students')" id="btnStd" class="bg-cyan-600 p-2 rounded-xl text-xs font-bold text-white">الطلاب</button>
                <button onclick="showTab('subjects')" id="btnSub" class="bg-slate-800 p-2 rounded-xl text-xs font-bold text-slate-300">المواد</button>
                <button onclick="showTab('materials')" id="btnMat" class="bg-slate-800 p-2 rounded-xl text-xs font-bold text-slate-300">الملازم</button>
            </div>
            <div id="adminForms" class="glass p-4 rounded-xl space-y-3">
                <!-- نماذج الإدارة -->
            </div>
        </div>

        <div id="contentList" class="space-y-3"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://buzhgwihzndbczmztfsp.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1emhnd2loem5kYmN6bXp0ZnNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyOTkwNjksImV4cCI6MjEwMTg3NTA2OX0.1tdXOa9wamfW3hBwdaTTpNK9U1g5G4Mqf2hwAe1Ojec';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let isAdmin = false;

        async function login() {
            try {
                const inputVal = document.getElementById('passInput').value.trim().toUpperCase();
                
                if (!inputVal) {
                    alert('الرجاء إدخال الرمز أولاً');
                    return;
                }

                // فحص رمز المدير
                if (inputVal === 'ADMIN-DFUTURE-2026') {
                    isAdmin = true;
                    showDashboard("المدير العام");
                    renderAdminUI();
                    return;
                }

                // فحص كود الطالب من قاعدة البيانات
                const { data, error } = await db.from('subscription_codes').select('*').eq('code', inputVal).maybeSingle();

                if (error) {
                    alert('خطأ في الاتصال بقاعدة البيانات: ' + error.message);
                    return;
                }

                if (data) {
                    isAdmin = false;
                    showDashboard(data.student_name);
                    renderStudentUI();
                } else {
                    alert('الرمز غير صحيح، يرجى التأكد منه.');
                }
            } catch (err) {
                alert('حدث خطأ غير متوقع: ' + err.message);
            }
        }

        function showDashboard(name) {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('welcomeTitle').innerText = "مرحباً، " + name;
        }

        function renderAdminUI() {
            document.getElementById('adminPanel').classList.remove('hidden');
            showTab('students');
        }

        async function showTab(tab) {
            const forms = document.getElementById('adminForms');
            const list = document.getElementById('contentList');
            list.innerHTML = `<div class="glass p-4 rounded-xl text-center text-xs text-slate-400">جاري التحميل...</div>`;

            if (tab === 'students') {
                forms.innerHTML = `
                    <h3 class="text-xs font-bold text-cyan-400">إضافة طالب وتوليد كود</h3>
                    <input id="stdName" placeholder="اسم الطالب الثلاثي" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-xs text-white outline-none">
                    <button onclick="addStudent()" class="w-full bg-emerald-600 hover:bg-emerald-700 py-2 rounded-lg text-xs font-medium text-white">توليد الكود</button>`;
                
                const { data } = await db.from('subscription_codes').select('*').order('created_at', { ascending: false });
                list.innerHTML = `<h3 class="text-xs font-bold text-slate-300">قائمة الطلاب</h3>` + (data || []).map(s => `
                    <div class="glass p-3 rounded-xl flex justify-between items-center text-xs">
                        <span class="text-white font-bold">${s.student_name}</span>
                        <span class="text-cyan-400 font-mono">${s.code}</span>
                    </div>`).join('');
            } else if (tab === 'subjects') {
                forms.innerHTML = `
                    <h3 class="text-xs font-bold text-cyan-400">إضافة مادة دراسية</h3>
                    <input id="subTitle" placeholder="اسم المادة" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-xs text-white outline-none">
                    <button onclick="addSubject()" class="w-full bg-blue-600 hover:bg-blue-700 py-2 rounded-lg text-xs font-medium text-white">حفظ المادة</button>`;
                
                const { data } = await db.from('subjects').select('*');
                list.innerHTML = `<h3 class="text-xs font-bold text-slate-300">المواد المضافة</h3>` + (data || []).map(s => `
                    <div class="glass p-3 rounded-xl text-xs text-white font-bold">${s.title}</div>`).join('');
            } else if (tab === 'materials') {
                forms.innerHTML = `
                    <h3 class="text-xs font-bold text-cyan-400">إضافة ملزمة أو ملخص</h3>
                    <input id="matTitle" placeholder="عنوان الملزمة" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-xs text-white outline-none">
                    <input id="matUrl" placeholder="رابط الملف" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-xs text-white outline-none">
                    <button onclick="addMat()" class="w-full bg-purple-600 hover:bg-purple-700 py-2 rounded-lg text-xs font-medium text-white">إضافة الملزمة</button>`;
                
                const { data } = await db.from('materials').select('*');
                list.innerHTML = `<h3 class="text-xs font-bold text-slate-300">الملازم المرفوعة</h3>` + (data || []).map(m => `
                    <div class="glass p-3 rounded-xl flex justify-between items-center text-xs">
                        <span class="text-white font-bold">${m.title}</span>
                        <a href="${m.file_url}" target="_blank" class="text-cyan-400 underline">فتح الرابط</a>
                    </div>`).join('');
            }
        }

        async function addStudent() {
            const name = document.getElementById('stdName').value.trim();
            if (!name) return alert('أدخل اسم الطالب');
            const code = 'DF-' + Math.random().toString(36).substring(2,8).toUpperCase();
            const { error } = await db.from('subscription_codes').insert({student_name: name, code: code});
            if (!error) {
                alert('تم إنشاء الكود بنجاح: ' + code);
                showTab('students');
            } else {
                alert('خطأ: ' + error.message);
            }
        }

        async function addSubject() {
            const title = document.getElementById('subTitle').value.trim();
            if (!title) return alert('أدخل اسم المادة');
            const { error } = await db.from('subjects').insert({title: title});
            if (!error) {
                alert('تمت إضافة المادة');
                showTab('subjects');
            } else {
                alert('خطأ: ' + error.message);
            }
        }
        
        async function addMat() {
            const title = document.getElementById('matTitle').value.trim();
            const url = document.getElementById('matUrl').value.trim();
            if (!title || !url) return alert('أدخل العنوان والرابط');
            const { error } = await db.from('materials').insert({title: title, file_url: url, subject_id: 1});
            if (!error) {
                alert('تمت إضافة الملزمة');
                showTab('materials');
            } else {
                alert('خطأ: ' + error.message);
            }
        }

        async function renderStudentUI() {
            const { data } = await db.from('subjects').select('*');
            document.getElementById('contentList').innerHTML = `<h3 class="text-xs font-bold text-slate-300 mb-2">المواد الدراسية</h3>` + (data || []).map(s => `
                <div class="glass p-4 rounded-xl text-white font-bold text-xs">${s.title}</div>
            `).join('');
        }
    </script>
</body>
</html>
