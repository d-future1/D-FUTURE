<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>D-FUTURE | لوحة التحكم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>body { background: #020617; color: #e2e8f0; }</style>
</head>
<body class="p-4">
    <!-- شاشة الدخول -->
    <section id="loginScreen" class="max-w-sm mx-auto mt-20 bg-slate-900 p-6 rounded-2xl border border-slate-800">
        <h2 class="text-center font-bold mb-4">دخول D-FUTURE</h2>
        <input type="password" id="codeInput" placeholder="أدخل الرمز" class="w-full bg-slate-950 p-3 rounded-lg mb-3 text-center tracking-widest outline-none border border-slate-700">
        <button onclick="login()" class="w-full bg-cyan-600 py-3 rounded-lg font-bold">دخول</button>
    </section>

    <!-- لوحة الطالب -->
    <section id="studentDashboard" class="hidden max-w-2xl mx-auto mt-10">
        <h2 class="text-xl font-bold mb-4">مرحباً بك في المنهج</h2>
        <div id="subjectsList" class="grid grid-cols-1 gap-3"></div>
    </section>

    <!-- لوحة الإدارة (تظهر فقط عند دخول رمز المدير) -->
    <section id="adminDashboard" class="hidden max-w-2xl mx-auto mt-10 p-6 bg-slate-800 rounded-xl border-2 border-cyan-500">
        <h2 class="text-2xl font-bold text-cyan-400 mb-4">لوحة تحكم المدير</h2>
        <div class="flex gap-2">
            <input type="text" id="newStudentName" placeholder="اسم الطالب" class="flex-1 bg-slate-900 p-2 rounded">
            <button onclick="generateCode()" class="bg-emerald-600 px-4 py-2 rounded">توليد كود</button>
        </div>
        <div id="codesList" class="mt-6 space-y-2"></div>
    </section>

    <script>
        const SUPABASE_URL = 'https://buzhgwihzndbczmztfsp.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1emhnd2loem5kYmN6bXp0ZnNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyOTkwNjksImV4cCI6MjEwMTg3NTA2OX0.1tdXOa9wamfW3hBwdaTTpNK9U1g5G4Mqf2hwAe1Ojec';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function login() {
            const code = document.getElementById('codeInput').value.trim().toUpperCase();
            
            // 1. فحص هل هو المدير؟
            if (code === 'ADMIN-DFUTURE-2026') {
                showAdminPanel();
                return;
            }

            // 2. فحص هل هو طالب؟
            const { data } = await db.from('subscription_codes').select('*').eq('code', code).maybeSingle();
            if (data) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('studentDashboard').classList.remove('hidden');
                document.getElementById('subjectsList').innerHTML = `<p class="p-4 bg-slate-800 rounded">مرحباً ${data.student_name}، جاري عرض المحتوى...</p>`;
            } else {
                alert('رمز غير صحيح');
            }
        }

        async function generateCode() {
            const name = document.getElementById('newStudentName').value;
            const newCode = 'DFUTURE-' + Math.random().toString(36).substr(2, 6).toUpperCase();
            await db.from('subscription_codes').insert({ code: newCode, student_name: name });
            alert('تم إنشاء كود للطالب: ' + newCode);
            loadCodes();
        }

        async function showAdminPanel() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('adminDashboard').classList.remove('hidden');
            loadCodes();
        }

        async function loadCodes() {
            const { data } = await db.from('subscription_codes').select('*');
            document.getElementById('codesList').innerHTML = data.map(c => `
                <div class="flex justify-between bg-slate-900 p-2 rounded">
                    <span>${c.student_name}</span>
                    <span class="font-mono text-cyan-400">${c.code}</span>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
